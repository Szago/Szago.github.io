<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eros Tools - Unit Stats Calculator</title>

    <link rel="stylesheet" href="../../shared-shell.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../calculator-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
</head>
<body>
    <main class="main-content">
        <section class="card setup-panel">
            <div class="card-header">
                <i class="fas fa-user-gear"></i>
                <h2>Unit Setup</h2>
            </div>

            <div class="setup-grid">
                <div class="input-group character-picker">
                    <label for="characterSearch">Character</label>
                    <div class="character-search" id="characterSearchBox">
                        <input type="search" id="characterSearch" placeholder="Search characters..." autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="characterResults" aria-expanded="false" disabled>
                        <i class="fas fa-chevron-down search-chevron"></i>
                        <div id="characterResults" class="character-results" role="listbox" hidden></div>
                    </div>
                </div>
                <div class="input-group">
                    <label for="levelInput">Level <span class="hint">(1 - 240)</span></label>
                    <input type="number" id="levelInput" min="1" max="240" value="221">
                </div>
                <div class="input-group">
                    <label for="rankInput">Rank <span class="hint">(1 - 21)</span></label>
                    <input type="number" id="rankInput" min="1" max="21" value="15">
                </div>
                <div class="input-group">
                    <label for="affectionInput">Affection <span class="hint">(1 - 20)</span></label>
                    <input type="number" id="affectionInput" min="1" max="20" value="1">
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="abbreviateCheckbox">
                    <span class="slider-toggle"></span>
                    <span class="toggle-label">Abbreviate large values</span>
                </label>
            </div>

            <div id="unitMeta" class="unit-meta" aria-live="polite"></div>
        </section>

        <div class="calculator-grid">
            <section class="card calculated-panel">
                <div class="card-header">
                    <i class="fas fa-chart-simple"></i>
                    <div>
                        <h2>Calculated Stats</h2>
                        <p>Includes affection and both statue bonuses.</p>
                    </div>
                </div>
                <div id="calculatedStats" class="stats-grid"></div>
            </section>

            <section class="card account-panel">
                <div class="card-header account-header">
                    <i class="fas fa-sliders"></i>
                    <div>
                        <h2>Account Modifiers</h2>
                        <p>Enter the flat bonuses shown by each statue.</p>
                    </div>
                    <button type="button" class="reset-btn" id="resetModifiers">
                        <i class="fas fa-rotate-left"></i> Reset statues
                    </button>
                </div>

                <div class="statue-grid">
                    <section class="statue-panel">
                        <h3><i class="fas fa-landmark"></i> Main Temple Statue</h3>
                        <div id="mainStatueRows" class="statue-fields"></div>
                    </section>
                    <section class="statue-panel">
                        <h3><i class="fas fa-monument"></i> Class Statue</h3>
                        <div id="classStatueRows" class="statue-fields"></div>
                    </section>
                </div>
            </section>
        </div>

        <div id="loadError" class="load-error" hidden></div>
    </main>

    <script src="../../navigation.js"></script>
    <script src="script.js"></script>
    <script>
        loadShell("Unit Stats Calculator", "none");
    </script>
</body>
</html>
